; XTEINK X4 terminal dashboard firmware
; Board: ESP32-C3, 16MB flash, GDEQ0426T82 (SSD1677) 800x480 e-ink panel

[env:xteink_x4]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; the stock board def assumes 4MB flash; the X4 actually has 16MB.
; both keys are required: build.flash_size drives the linker/partition
; table generation, upload.flash_size drives the esptool --flash-size flag
; actually written to the chip.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; the board default is qio, but this hardware is wired for DIO only -
; qio relabeled as dio still runs the qio-compiled SPI driver and
; corrupts reads past the bootloader. force the dio-compiled variant.
board_build.flash_mode = dio


monitor_speed = 115200
upload_speed = 921600

lib_deps =
	zinggjm/GxEPD2@^1.6.4
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit BusIO@^1.16.1

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
